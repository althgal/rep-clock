<style>
/* Layout: one-screen gym scoreboard. Giant clock on top, phase-colored; setup rows below, locked while running. Committed dark look. */
:root {
  --bg: #0E1824;
  --panel: #16243A;
  --line: #24364F;
  --fg: #EAF0F6;
  --muted: #8D9DB2;
  --ready: #F4C247;
  --work: #FF6B3D;
  --rest: #4CC4C9;
  --done: #A7E07A;
  --phase: var(--muted);
  --display: "Big Shoulders Display", "Avenir Next Condensed", "sans-serif-condensed", "Roboto Condensed", "Arial Narrow", Impact, sans-serif;
  --body: "Barlow", -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }
[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 15px;
  -webkit-tap-highlight-color: transparent;
}
.wrap {
  max-width: 640px;
  margin: 0 auto;
  padding-block: 16px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 18px;
}
header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
h1 {
  font-family: var(--display); font-weight: 900; font-size: 1.6rem;
  letter-spacing: .06em; text-transform: uppercase; margin: 0; white-space: nowrap;
}
.summary { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; text-align: right; }

/* Clock */
.clock {
  position: relative;
  background: var(--panel);
  border: 2px solid var(--phase);
  border-radius: 14px;
  padding: 18px 16px 20px;
  display: grid; justify-items: center; gap: 4px;
  transition: border-color .25s;
  overflow: hidden;
}
.clock::before {
  content: ""; position: absolute; inset: 0;
  background: var(--phase); opacity: .09; pointer-events: none;
  transition: background .25s;
}
.phase {
  font-family: var(--display); font-weight: 800;
  font-size: clamp(1.4rem, 6vw, 2rem);
  letter-spacing: .18em; text-transform: uppercase;
  color: var(--phase);
}
.time {
  font-family: var(--display); font-weight: 900;
  font-size: clamp(6rem, 34vw, 13rem);
  line-height: .9;
  font-variant-numeric: tabular-nums;
  letter-spacing: .01em;
}
.meta {
  display: flex; gap: 18px; color: var(--muted);
  font-size: .95rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  font-variant-numeric: tabular-nums;
}
.meta b { color: var(--fg); font-weight: 700; }
.bar {
  position: absolute; left: 0; bottom: 0; height: 6px; width: 100%;
  background: var(--line);
}
.bar span { display: block; height: 100%; width: 0; background: var(--phase); }
.clock.pulse .time { animation: pulse .35s ease-out; }
@keyframes pulse { from { transform: scale(1.06); } to { transform: scale(1); } }

/* Controls */
.controls { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 10px; }
button { font-family: var(--body); cursor: pointer; }
.btn {
  border: 2px solid var(--line); background: var(--panel); color: var(--fg);
  border-radius: 10px; padding: 14px 10px;
  font-weight: 700; font-size: 1rem; letter-spacing: .08em; text-transform: uppercase;
}
.btn.main {
  background: var(--fg); color: var(--bg); border-color: var(--fg);
  font-family: var(--display); font-weight: 900; font-size: 1.6rem; letter-spacing: .12em;
  padding: 10px;
}
.btn:disabled { opacity: .35; cursor: default; }
.btn:focus-visible, .seg button:focus-visible, .step button:focus-visible, .tone:focus-visible, input:focus-visible {
  outline: 3px solid var(--ready); outline-offset: 2px;
}

/* Setup */
.setup {
  display: grid; gap: 14px;
  border-top: 1px solid var(--line); padding-top: 16px;
}
.setup.locked { opacity: .45; pointer-events: none; }
.row { display: grid; grid-template-columns: 7.5rem 1fr; align-items: center; gap: 12px; }
.row > label, .row > .lbl {
  font-size: .78rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
}
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button {
  flex: 1 1 0; min-width: 3.6rem;
  background: transparent; color: var(--fg);
  border: 1.5px solid var(--line); border-radius: 8px;
  padding: 9px 6px; font-weight: 600; font-size: .95rem;
  font-variant-numeric: tabular-nums;
}
.seg button[aria-pressed="true"] { border-color: var(--seg, var(--fg)); color: var(--bg); background: var(--seg, var(--fg)); }
.seg.work { --seg: var(--work); }
.seg.rest { --seg: var(--rest); }
.seg.warn { --seg: var(--ready); }
.step { display: flex; align-items: center; gap: 8px; }
.step button {
  width: 42px; height: 40px; border-radius: 8px;
  border: 1.5px solid var(--line); background: transparent; color: var(--fg);
  font-size: 1.3rem; font-weight: 700;
}
.step output {
  min-width: 3.2rem; text-align: center;
  font-family: var(--display); font-weight: 800; font-size: 1.6rem; font-variant-numeric: tabular-nums;
}
.step small { color: var(--muted); font-size: .85rem; }
input[type="range"] { width: 100%; accent-color: var(--fg); }

/* Sound key */
.tones { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.tone {
  display: grid; gap: 2px; text-align: left;
  background: transparent; color: var(--fg);
  border: 1.5px solid var(--line); border-radius: 8px; padding: 9px 11px;
}
.tone strong { font-size: .9rem; display: flex; align-items: center; gap: 7px; }
.tone strong::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.tone span { color: var(--muted); font-size: .78rem; }
.hint { color: var(--muted); font-size: .8rem; margin: 0; line-height: 1.45; }

@media (max-width: 420px) {
  .row { grid-template-columns: 1fr; gap: 6px; }
}
@media (prefers-reduced-motion: reduce) {
  .clock.pulse .time { animation: none; }
  .clock, .clock::before { transition: none; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Rep Clock</h1>
    <div class="summary" id="summary"></div>
  </header>

  <section class="clock" id="clock" aria-live="polite">
    <div class="phase" id="phase">Ready</div>
    <div class="time" id="time">1:00</div>
    <div class="meta">
      <span>Rep <b id="rep">0</b><span id="repOf"></span></span>
      <span>Next <b id="next">Work</b></span>
    </div>
    <div class="bar"><span id="bar"></span></div>
  </section>

  <div class="controls">
    <button class="btn" id="reset" type="button">Reset</button>
    <button class="btn main" id="go" type="button">Start</button>
    <button class="btn" id="skip" type="button" disabled>Skip</button>
  </div>

  <section class="setup" id="setup">
    <div class="row">
      <span class="lbl" id="l-work">Rep length</span>
      <div class="seg work" data-key="work" role="group" aria-labelledby="l-work">
        <button type="button" data-v="30">30 sec</button>
        <button type="button" data-v="60">1 min</button>
      </div>
    </div>
    <div class="row">
      <span class="lbl" id="l-rest">Rest</span>
      <div class="seg rest" data-key="rest" role="group" aria-labelledby="l-rest">
        <button type="button" data-v="10">10s</button>
        <button type="button" data-v="30">30s</button>
        <button type="button" data-v="60">1 min</button>
        <button type="button" data-v="240">4 min</button>
      </div>
    </div>
    <div class="row">
      <span class="lbl" id="l-warn">Warning at</span>
      <div class="seg warn" data-key="warn" role="group" aria-labelledby="l-warn">
        <button type="button" data-v="5">5s left</button>
        <button type="button" data-v="10">10s left</button>
        <button type="button" data-v="15">15s left</button>
      </div>
    </div>
    <div class="row">
      <span class="lbl" id="l-reps">Reps</span>
      <div class="step" role="group" aria-labelledby="l-reps">
        <button type="button" id="repsDown" aria-label="Fewer reps">−</button>
        <output id="repsOut">5</output>
        <button type="button" id="repsUp" aria-label="More reps">+</button>
        <small id="repsNote"></small>
      </div>
    </div>
    <div class="row">
      <label for="vol">Volume</label>
      <input type="range" id="vol" min="0" max="1.5" step="0.05" value="0.8">
    </div>

    <div class="row" style="align-items:start">
      <span class="lbl">Sounds<br><small style="text-transform:none;letter-spacing:0;font-weight:500">tap to hear</small></span>
      <div class="tones">
        <button class="tone" type="button" data-tone="count" style="--c:var(--ready)"><strong>Count-in</strong><span>3 · 2 · 1 soft ticks</span></button>
        <button class="tone" type="button" data-tone="go" style="--c:var(--work)"><strong>Go</strong><span>Bright rising chime, rep starts</span></button>
        <button class="tone" type="button" data-tone="warn" style="--c:var(--ready)"><strong>Almost done</strong><span>Three gentle dings</span></button>
        <button class="tone" type="button" data-tone="end" style="--c:var(--rest)"><strong>Time</strong><span>Falling two-note chime, rep over</span></button>
        <button class="tone" type="button" data-tone="finish" style="--c:var(--done)"><strong>Finished</strong><span>Ringing arpeggio, all reps done</span></button>
      </div>
    </div>
    <p class="hint">Space bar starts and pauses. The rest counts you back in with the same 3-2-1 pips, then Go. Keep this tab open and the screen will stay awake while it runs.</p>
  </section>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const COUNTIN = 3;

  // ---------- settings ----------
  const settings = { work: 60, rest: 30, warn: 10, reps: 5, vol: 0.8 };
  try { Object.assign(settings, JSON.parse(localStorage.getItem('repclock') || '{}')); } catch (e) {}
  const save = () => { try { localStorage.setItem('repclock', JSON.stringify(settings)); } catch (e) {} };

  // ---------- audio ----------
  let ctx = null, master = null;
  let scheduled = [];
  function audio() {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain();
      master.gain.value = settings.vol;
      master.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  // Soft bell/chime: pure sine partials, gentle attack, natural exponential ring-out.
  // Higher partials are quieter and fade faster, like a struck glass or small bell.
  const PARTIALS = [[1, 1], [2, 0.28], [3.01, 0.08], [4.2, 0.03]];
  function chime(t, freq, ring = 1.2, peak = 0.32) {
    PARTIALS.forEach(([mult, amp], i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(freq * mult, t);
      const a = peak * amp, decay = ring / (1 + i * 0.9);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(a, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
      o.connect(g); g.connect(master);
      o.start(t); o.stop(t + decay + 0.05);
      scheduled.push(o);
      o.onended = () => { scheduled = scheduled.filter(x => x !== o); };
    });
  }
  const TONES = {
    // single soft tick-chime
    count:  t => chime(t, 784, 0.45, 0.28),
    // bright two-note rise, overlapping
    go:     t => { chime(t, 1047, 1.3, 0.3); chime(t + 0.11, 1568, 1.6, 0.26); },
    // three gentle dings
    warn:   t => { for (let i = 0; i < 3; i++) chime(t + i * 0.2, 1319, 0.55, 0.22); },
    // calm two-note fall
    end:    t => { chime(t, 988, 1.4, 0.3); chime(t + 0.22, 659, 2.0, 0.32); },
    // rising four-note arpeggio that rings out
    finish: t => [523, 659, 784, 1047].forEach((f, i) => chime(t + i * 0.16, f, i === 3 ? 2.6 : 1.4, 0.28)),
  };
  function stopScheduled() {
    scheduled.forEach(o => { try { o.stop(); } catch (e) {} });
    scheduled = [];
  }

  // ---------- state ----------
  // phase: idle | countin | work | rest | done
  const S = { phase: 'idle', rep: 0, start: 0, elapsed: 0, running: false };
  const total = () => settings.reps || Infinity;
  const dur = p => p === 'countin' ? COUNTIN : p === 'work' ? settings.work : p === 'rest' ? settings.rest : 0;
  const isLastRep = () => S.rep >= total();

  // events for a phase, as [secondsIntoPhase, tone]
  function events(p) {
    const d = dur(p), ev = [];
    if (p === 'countin') { for (let i = 0; i < COUNTIN; i++) ev.push([i, 'count']); ev.push([d, 'go']); }
    if (p === 'work') {
      if (settings.warn < d) ev.push([d - settings.warn, 'warn']);
      ev.push([d, isLastRep() ? 'finish' : 'end']);
    }
    if (p === 'rest') {
      for (let i = 3; i >= 1; i--) if (d - i >= 0) ev.push([d - i, 'count']);
      ev.push([d, 'go']);
    }
    return ev;
  }
  function schedulePhase(fromElapsed) {
    stopScheduled();
    events(S.phase).forEach(([t, tone]) => {
      const ok = fromElapsed === 0 ? t >= 0 : t > fromElapsed + 0.03;
      if (ok) TONES[tone](S.start + t);
    });
  }
  function enter(p, startAt) {
    S.phase = p;
    S.start = startAt;
    if (p === 'work') S.rep++;
    schedulePhase(0);
    pulse();
  }
  function advance(at) {
    // called when the current phase reaches its end at audio time `at`
    if (S.phase === 'countin' || S.phase === 'rest') return enter('work', at);
    if (S.phase === 'work') {
      if (isLastRep()) return finish();
      return enter('rest', at);
    }
  }
  function finish() {
    S.phase = 'done'; S.running = false;
    releaseWake();
    render(); pulse();
  }

  function start() {
    audio();
    if (S.phase === 'idle' || S.phase === 'done') {
      S.rep = 0;
      S.running = true;
      enter('countin', ctx.currentTime + 0.05);
    } else {
      // resume from pause
      S.running = true;
      S.start = ctx.currentTime - S.elapsed;
      schedulePhase(S.elapsed);
    }
    requestWake();
    render();
  }
  function pause() {
    S.elapsed = ctx.currentTime - S.start;
    S.running = false;
    stopScheduled();
    releaseWake();
    render();
  }
  function reset() {
    stopScheduled();
    S.phase = 'idle'; S.rep = 0; S.running = false; S.elapsed = 0;
    releaseWake();
    render();
  }
  function skip() {
    if (S.phase === 'idle' || S.phase === 'done') return;
    audio();
    const now = ctx.currentTime;
    if (!S.running) { S.running = true; requestWake(); }
    if (S.phase === 'work' && isLastRep()) { stopScheduled(); TONES.finish(now); return finish(); }
    const going = S.phase === 'countin' || S.phase === 'rest';
    stopScheduled();
    if (going) TONES.go(now); else TONES.end(now);
    advance(now);
    render();
  }

  // ---------- loop ----------
  function tick() {
    if (S.running && ctx) {
      // catch up through any phases that ended (e.g. tab was in background)
      let guard = 0;
      while (S.running && ctx.currentTime - S.start >= dur(S.phase) && guard++ < 50) {
        advance(S.start + dur(S.phase));
      }
    }
    render();
  }
  setInterval(tick, 100);

  // ---------- render ----------
  const fmt = s => {
    s = Math.max(0, Math.ceil(s - 0.001));
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  };
  const label = { idle: 'Ready', countin: 'Get ready', work: 'Work', rest: 'Rest', done: 'Done' };
  const color = { idle: 'var(--muted)', countin: 'var(--ready)', work: 'var(--work)', rest: 'var(--rest)', done: 'var(--done)' };
  let lastShown = '';
  function render() {
    const p = S.phase, d = dur(p);
    const el = p === 'idle' || p === 'done' ? 0 : (S.running ? ctx.currentTime - S.start : S.elapsed);
    let shown;
    if (p === 'idle') shown = fmt(settings.work);
    else if (p === 'done') shown = '0:00';
    else if (p === 'countin') shown = String(Math.max(1, Math.ceil(d - el)));
    else shown = fmt(d - el);
    if (shown !== lastShown) { $('time').textContent = shown; lastShown = shown; }

    const warnOn = p === 'work' && d - el <= settings.warn;
    document.documentElement.style.setProperty('--phase', warnOn ? 'var(--ready)' : color[p]);
    $('phase').textContent = (S.running || p === 'idle' || p === 'done') ? (warnOn ? 'Almost done' : label[p]) : 'Paused';
    $('bar').style.width = (d ? Math.min(100, (el / d) * 100) : (p === 'done' ? 100 : 0)) + '%';

    $('rep').textContent = S.rep;
    $('repOf').textContent = settings.reps ? ' / ' + settings.reps : '';
    let next = '—';
    if (p === 'idle' || p === 'countin') next = 'Work ' + fmt(settings.work);
    else if (p === 'work') next = isLastRep() ? 'Finish' : 'Rest ' + fmt(settings.rest);
    else if (p === 'rest') next = 'Work ' + fmt(settings.work);
    else if (p === 'done') next = 'Start again';
    $('next').textContent = next;

    $('go').textContent = S.running ? 'Pause' : (p === 'idle' || p === 'done') ? 'Start' : 'Resume';
    $('skip').disabled = p === 'idle' || p === 'done';
    $('setup').classList.toggle('locked', p !== 'idle' && p !== 'done');
  }
  function pulse() {
    const c = $('clock');
    c.classList.remove('pulse'); void c.offsetWidth; c.classList.add('pulse');
  }

  // ---------- setup UI ----------
  function syncSetup() {
    document.querySelectorAll('.seg').forEach(seg => {
      const k = seg.dataset.key;
      seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.v === settings[k])));
    });
    $('repsOut').textContent = settings.reps || '∞';
    $('repsNote').textContent = settings.reps ? '' : 'until you stop';
    $('vol').value = settings.vol;
    const n = settings.reps;
    if (n) {
      const secs = COUNTIN + n * settings.work + (n - 1) * settings.rest;
      $('summary').textContent = `${n} × ${fmt(settings.work)} · rest ${fmt(settings.rest)} · ${fmt(secs)} total`;
    } else {
      $('summary').textContent = `${fmt(settings.work)} on · ${fmt(settings.rest)} rest · open-ended`;
    }
  }
  document.querySelectorAll('.seg').forEach(seg => seg.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    settings[seg.dataset.key] = +b.dataset.v;
    save(); syncSetup(); render();
  }));
  $('repsDown').onclick = () => { settings.reps = Math.max(0, settings.reps - 1); save(); syncSetup(); render(); };
  $('repsUp').onclick = () => { settings.reps = Math.min(50, settings.reps + 1); save(); syncSetup(); render(); };
  $('vol').oninput = e => { settings.vol = +e.target.value; if (master) master.gain.value = settings.vol; save(); };
  document.querySelectorAll('.tone').forEach(b => b.addEventListener('click', () => {
    audio(); TONES[b.dataset.tone](ctx.currentTime + 0.02);
  }));

  $('go').onclick = () => S.running ? pause() : start();
  $('reset').onclick = reset;
  $('skip').onclick = skip;
  document.addEventListener('keydown', e => {
    if (e.code === 'Space' && !e.target.closest('input')) { e.preventDefault(); S.running ? pause() : start(); }
  });

  // ---------- keep screen awake ----------
  let wake = null;
  async function requestWake() {
    try { if ('wakeLock' in navigator && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch (e) {}
  }
  function releaseWake() { try { wake && wake.release(); } catch (e) {} wake = null; }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.running) requestWake(); });

  syncSetup(); render();
})();
</script>

</body>
</html>
